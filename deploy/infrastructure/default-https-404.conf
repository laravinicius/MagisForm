# Resposta de fallback TLS para SNI/Host sem Proxy Host cadastrado.
# O certificado é autossinado e serve apenas para completar TLS antes do 404;
# hosts de farmácia sempre selecionam seu certificado individual no NPM.
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;
  ssl_certificate /etc/nginx/certs/default.crt;
  ssl_certificate_key /etc/nginx/certs/default.key;
  return 404;
}
