services:
  mariadb:
    image: mariadb:11
    container_name: magisform
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: magisform
      MARIADB_ROOT_PASSWORD: magisform_root_dev
      MARIADB_USER: magisform_app
      MARIADB_PASSWORD: magisform_dev
    ports:
      - "3306:3306"
    volumes:
      - magisform-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  magisform-mariadb-data:
